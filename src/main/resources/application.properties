spring.application.name=RBPOLab2

# Подключение к PostgreSQL с поддержкой переменных окружения
spring.datasource.url=\${DB_URL:jdbc:postgresql://localhost:5432/grant_db}
spring.datasource.username=\${DB_USERNAME:grant_app_user}
spring.datasource.password=\${DB_PASSWORD:9087}
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки JPA / Hibernate: автоматическое создание и обновление таблиц по сущностям
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false